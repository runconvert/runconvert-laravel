name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: "12", php: "8.2", testbench: "^10.0" }
          - { laravel: "13", php: "8.3", testbench: "^11.0" }
          - { laravel: "13", php: "8.4", testbench: "^11.0" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
      - run: |
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit
