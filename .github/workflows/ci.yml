name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: "10", php: "8.1", testbench: "^8.0" }
          - { laravel: "11", php: "8.2", testbench: "^9.0" }
          - { laravel: "12", php: "8.3", testbench: "^10.0" }
    steps:
      - uses: actions/checkout@v5
      # runconvert-php isn't on Packagist yet: check it out next to this repo and use it as a path repository.
      - uses: actions/checkout@v5
        with:
          repository: runconvert/runconvert-php
          path: runconvert-php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: |
          composer config repositories.php '{"type":"path","url":"runconvert-php","options":{"symlink":false,"versions":{"runconvert/runconvert-php":"0.1.0"}}}'
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit
